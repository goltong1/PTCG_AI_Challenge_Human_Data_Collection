services:
  cabt-web:
    build: .
    ports:
      - "8765:8765"
    environment:
      CABT_PUBLIC_MODE: "1"
      CABT_ENABLE_RESULT_SUBMISSION: "1"
      CABT_DATA_DIR: /data
      CABT_ADMIN_TOKEN: change-this-admin-token
      CABT_MAX_SESSIONS: "6"
      CABT_SESSION_IDLE_SECONDS: "3600"
    volumes:
      - cabt-data:/data
    restart: unless-stopped

volumes:
  cabt-data:
