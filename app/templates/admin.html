<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>CABT · 제출 결과 관리</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body class="admin-page">
  <main class="admin-shell">
    <header class="admin-header panel">
      <div>
        <span class="kicker">CABT SERVER ADMIN</span>
        <h1>대전 결과 수집함</h1>
        <p>사용자가 전송한 승패 요약을 확인하고 전체 기록 ZIP을 내려받습니다.</p>
      </div>
      <a class="button quiet" href="/">아레나로 이동</a>
    </header>

    <section class="admin-auth panel">
      <label>
        <span>관리자 토큰</span>
        <input id="admin-token" type="password" autocomplete="current-password" placeholder="CABT_ADMIN_TOKEN">
      </label>
      <button id="load-submissions" class="button primary" type="button">결과 불러오기</button>
      <span id="admin-status">토큰은 브라우저 세션에만 보관됩니다.</span>
    </section>

    <section class="admin-summary-grid">
      <div class="panel admin-metric"><span>전체 제출</span><strong id="metric-total">0</strong></div>
      <div class="panel admin-metric"><span>사람 승리</span><strong id="metric-human">0</strong></div>
      <div class="panel admin-metric"><span>AI 승리</span><strong id="metric-ai">0</strong></div>
      <div class="panel admin-metric"><span>무승부</span><strong id="metric-draw">0</strong></div>
    </section>

    <section class="panel admin-results">
      <div class="section-heading">
        <div>
          <span class="kicker">SUBMISSIONS</span>
          <h2>전송된 대전</h2>
        </div>
        <button id="refresh-submissions" class="button quiet" type="button">새로고침</button>
      </div>
      <div class="admin-table-wrap">
        <table>
          <thead>
            <tr>
              <th>전송 시각</th>
              <th>플레이어</th>
              <th>AI</th>
              <th>덱</th>
              <th>결과</th>
              <th>액션</th>
              <th>파일</th>
            </tr>
          </thead>
          <tbody id="submission-rows">
            <tr><td colspan="7" class="admin-empty">관리자 토큰을 입력하세요.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/static/admin.js"></script>
</body>
</html>
